<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Snake Game</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Import map for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- HUD Overlay -->
    <div id="hud-overlay">
        <!-- Controls Help Guide -->
        <div id="help-panel" class="panel">
            <h3>3D Snake Controls</h3>
            <ul>
                <li><span class="key">A</span> / <span class="key">D</span> or <span class="key">←</span> / <span class="key">→</span> : Turn Left / Right</li>
                <li><span class="key">W</span> / <span class="key">S</span> or <span class="key">↑</span> / <span class="key">↓</span> : Pitch Up / Down</li>
                <li><span class="key">Space</span> : Speed Boost</li>
                <li><span class="key">C</span> : Toggle Camera Mode</li>
                <li><span class="key">P</span> : Pause Game</li>
                <li><span class="key">R</span> : Restart Game</li>
            </ul>
        </div>

        <!-- Scoreboard Panel -->
        <div id="score-panel" class="panel">
            <div class="score-item">
                <span class="score-label">SCORE</span>
                <span id="val-score" class="score-value">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">LENGTH</span>
                <span id="val-length" class="score-value">3</span>
            </div>
            <div class="score-item">
                <span class="score-label">HIGH SCORE</span>
                <span id="val-highscore" class="score-value">0</span>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-overlay" class="hidden">
            <div class="modal-box">
                <h2>GAME OVER</h2>
                <p id="game-over-reason">You crashed!</p>
                <div class="final-scores">
                    <div>Final Score: <span id="final-score">0</span></div>
                    <div>High Score: <span id="final-highscore">0</span></div>
                </div>
                <button id="restart-btn" class="action-btn">Play Again (R)</button>
            </div>
        </div>

        <!-- Pause Overlay -->
        <div id="pause-overlay" class="hidden">
            <div class="modal-box">
                <h2>PAUSED</h2>
                <p>Press <span class="key">P</span> to Resume</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
